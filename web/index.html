<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulation du système solaire</title>

    <link rel="stylesheet" href="fichier_index.css">

    <!-- P5.js -->
    <script src="p5_lib/p5.js"></script>

    <script src="fichier_script_index.js" defer></script>
</head>

<body>

    <header>
        <h1>Simulation des trajectoires planétaires</h1>

        <p>Trajectoires calculées en C selon la méthode de calcul d'Euler puis affichées avec la bibliothèque P5.js</p>
    </header>

    <main>
        <div id="infos">
            <h2>Informations</h2>

            <p>Temps simulé : <span id="temps">0</span> h</p>
            <p>Nombre de trajectoires : <span id="nbPlanetes">0</span></p>

            <h2>Contrôles</h2>

            <button id="pauseBtn">Pause</button>

            <h3>Planètes affichées</h3>

            <div id="planetFilters">
                <!-- Cases générées automatiquement -->
            </div>

            <div class="filterButtons">
                <button id="selectAllBtn">Tout sélectionner</button> 
                <button id="clearAllBtn">Tout désélectionner</button>
            </div>
        </div>

        <div id="canvas-container"></div>
    </main>

</body>
</html>
